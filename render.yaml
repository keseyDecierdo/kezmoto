# Render Blueprint: deploys KEZMOTO as a static site (Vite build → dist/).
services:
  - type: web
    name: kezmoto
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Filled in on Render's dashboard (sync: false keeps them out of git).
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    routes:
      # Single-page app: every path (/login, /reset-password, /listing/…) serves index.html.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

  # Private Python face-matching API (face-service/), called only by the
  # Supabase face-match Edge Function. Compares the face on a user's valid ID
  # with their live selfie using the open-source face_recognition library.
  - type: web
    name: kezmoto-face-service
    runtime: docker
    rootDir: face-service
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      # Shared secret - Render generates it; copy the same value into the
      # Supabase Edge Function secret FACE_SERVICE_SECRET.
      - key: FACE_SERVICE_SECRET
        generateValue: true
      # Max face distance that counts as the same person (lower = stricter).
      - key: FACE_MATCH_THRESHOLD
        value: "0.4"

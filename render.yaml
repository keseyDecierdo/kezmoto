# Render Blueprint: deploys KEZMOTO as a static site (Vite build → dist/).
services:
  - type: web
    name: kezmoto
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Filled in on Render's dashboard (sync: false keeps them out of git).
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    routes:
      # Single-page app: every path (/login, /reset-password, /listing/…) serves index.html.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
